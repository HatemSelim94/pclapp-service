[project]
name = "pclapp-service"
version = "0.1.0"
description = "REST backend around the pclapp point-cloud package: uploads, a Postgres-backed job queue, results."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Hatem Selim" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The processing library. Needs PCL on the machine (apt install libpcl-dev on Ubuntu).
# The API never imports it; only the worker does, so the API image can stay slim.
pcl = ["pclapp @ git+https://github.com/HatemSelim94/PCL-App"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pclapp-worker = "worker.main:main"
pclapp-cleanup = "app.cleanup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]
# packages= already includes app/static/*.html; listed for clarity
artifacts = ["app/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.isort]
# the alembic/ directory in the repo root is migrations, not the alembic package
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["app", "worker", "tests"]

[[tool.mypy.overrides]]
module = ["pclapp", "pclapp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
