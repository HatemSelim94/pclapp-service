name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, and the test suite against a real PostgreSQL 16.
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pclapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PCLAPP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pclapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # The migration must also be the single source of truth for the schema.
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          PCLAPP_DATABASE_URL: ${{ env.PCLAPP_TEST_DATABASE_URL }}

  # Build both images, bring the stack up with Compose and run the end-to-end smoke test.
  # This is also where the real pclapp processor (PCL) gets exercised: the worker image
  # compiles the bindings, and the smoke test checks point count and cluster sizes.
  compose:
    runs-on: ubuntu-24.04
    needs: test
    env:
      PCLAPP_ADMIN_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: pclapp-service-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image (compiles pclapp against PCL)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          tags: pclapp-service-worker
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: docker compose up
        run: docker compose up -d --no-build

      - name: Smoke test
        run: scripts/smoke.sh http://localhost:8000

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=100

      - name: Graceful shutdown (worker gets SIGTERM)
        if: always()
        run: docker compose down -v
